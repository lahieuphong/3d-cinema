<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Before anything is painted: the landing content below belongs to "/" only (this document
      // also answers unknown paths, where the app shows "not found").
      document.documentElement.dataset.route = location.pathname.replace(/\/+$/, '') === '' ? 'landing' : 'other';
      // "Giảm hiệu ứng kính" (src/glass.ts), before the first paint.
      try { if (localStorage.getItem('tp-glass') === 'reduced') document.documentElement.dataset.glass = 'reduced'; } catch (e) {}
    </script>
    <style>
      html { background: #14110f; color: #f3ede5; }
      html[data-route='other'] [data-landing] { display: none; }
      html:not([data-route='other']) [data-boot] { display: none; }
      [data-boot] { display: grid; place-content: center; gap: 12px; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #bdb1a3; text-align: center; }
      [data-boot] button { justify-self: center; min-height: 44px; padding: 8px 16px; border: 1px solid #3b312b; border-radius: 8px; background: #1c1815; color: #f3ede5; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <noscript><p class="noscript-note">Phòng chiếu 3D cần JavaScript và WebGL. Phần giới thiệu bên dưới vẫn đọc được.</p></noscript>
    <div id="app"><!--landing--><p data-boot role="status">Đang tải trang…</p></div>
    <script>
      // If the app has not taken over an unknown path after a while, say so.
      setTimeout(function () {
        var boot = document.querySelector('#app > [data-boot]');
        if (!boot || document.documentElement.dataset.route !== 'other') return;
        boot.textContent = 'Trang đang tải lâu hơn bình thường. Hãy kiểm tra kết nối mạng.';
        var reload = document.createElement('button');
        reload.type = 'button';
        reload.textContent = 'Tải lại trang';
        reload.onclick = function () { location.reload(); };
        boot.appendChild(reload);
      }, 15000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
